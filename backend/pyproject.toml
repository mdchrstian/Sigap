[project]
name = "sigap-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["django>=5.2,<6","djangorestframework","djangorestframework-simplejwt","django-environ","django-cors-headers","django-storages[s3]","boto3","psycopg[binary]","pgvector","Pillow","openai","requests"]

[dependency-groups]
dev = ["pytest","pytest-django"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
